<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Manajemen Menu Makanan Sehat</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f6fa;
    padding:30px;
}

h1{
    text-align:center;
    margin-bottom:30px;
    color:#1e293b;
}

.container{
    max-width:1200px;
    margin:auto;
    display:flex;
    gap:30px;
}

.card{
    background:#fff;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    padding:25px;
}

.form-card{
    width:350px;
}

.table-card{
    flex:1;
}

h2{
    margin-bottom:15px;
    color:#1e293b;
    border-bottom:1px solid #ddd;
    padding-bottom:10px;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:5px;
    font-size:14px;
}

input,select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:14px;
}

.button-group{
    display:flex;
    gap:10px;
    margin-top:20px;
}

button{
    flex:1;
    padding:10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    color:white;
}

.btn-save{
    background:#10b981;
}

.btn-delete{
    background:#ef4444;
}

.btn-reset{
    background:#64748b;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th{
    background:#e5e7eb;
    padding:12px;
    text-align:left;
}

td{
    padding:12px;
    border-bottom:1px solid #ddd;
}

tbody tr{
    cursor:pointer;
}

tbody tr:hover{
    background:#ecfdf5;
}
</style>
</head>

<body>

<h1>🥗 Sistem Manajemen Menu Makanan Sehat</h1>

<div class="container">

    <!-- FORM -->
    <div class="card form-card">

        <h2>Tambah / Edit Menu</h2>

        <div class="form-group">
            <label>ID Menu</label>
            <input type="text" id="idMenu">
        </div>

        <div class="form-group">
            <label>Nama Makanan</label>
            <input type="text" id="namaMakanan">
        </div>

        <div class="form-group">
            <label>Kategori</label>
            <select id="kategori">
                <option>Sayuran</option>
                <option>Buah</option>
                <option>Protein</option>
                <option>Karbohidrat Sehat</option>
                <option>Minuman Sehat</option>
            </select>
        </div>

        <div class="form-group">
            <label>Kalori (kkal)</label>
            <input type="number" id="kalori">
        </div>

        <div class="form-group">
            <label>Harga Menu (Rp)</label>
            <input type="number" id="harga">
        </div>

        <div class="button-group">
            <button class="btn-save" onclick="simpanData()">Simpan</button>
            <button class="btn-delete" onclick="hapusData()">Hapus</button>
            <button class="btn-reset" onclick="resetForm()">Reset</button>
        </div>

    </div>

    <!-- TABEL -->
    <div class="card table-card">

        <h2>Daftar Menu Makanan Sehat (Klik Baris untuk Edit)</h2>

        <table>
            <thead>
                <tr>
                    <th>ID Menu</th>
                    <th>Nama Makanan</th>
                    <th>Kategori</th>
                    <th>Kalori</th>
                    <th>Harga (Rp)</th>
                </tr>
            </thead>

            <tbody id="tableBody"></tbody>
        </table>

    </div>

</div>

<script>

let dataMenu = JSON.parse(localStorage.getItem("MenuSehat")) || [];
let selectedIndex = -1;

function tampilData(){

    let tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    dataMenu.forEach((menu,index)=>{

        tbody.innerHTML += `
        <tr onclick="editData(${index})">
            <td>${menu.id}</td>
            <td>${menu.nama}</td>
            <td>${menu.kategori}</td>
            <td>${menu.kalori}</td>
            <td>${Number(menu.harga).toLocaleString('id-ID')}</td>
        </tr>
        `;
    });

    localStorage.setItem("MenuSehat",JSON.stringify(dataMenu));
}

function simpanData(){

    let id = document.getElementById("idMenu").value;
    let nama = document.getElementById("namaMakanan").value;
    let kategori = document.getElementById("kategori").value;
    let kalori = document.getElementById("kalori").value;
    let harga = document.getElementById("harga").value;

    if(id=="" || nama==""){
        alert("Lengkapi data terlebih dahulu");
        return;
    }

    let data = {
        id,
        nama,
        kategori,
        kalori,
        harga
    };

    if(selectedIndex==-1){
        dataMenu.push(data);
    }else{
        dataMenu[selectedIndex] = data;
    }

    tampilData();
    resetForm();
}

function editData(index){

    selectedIndex = index;

    document.getElementById("idMenu").value = dataMenu[index].id;
    document.getElementById("namaMakanan").value = dataMenu[index].nama;
    document.getElementById("kategori").value = dataMenu[index].kategori;
    document.getElementById("kalori").value = dataMenu[index].kalori;
    document.getElementById("harga").value = dataMenu[index].harga;
}

function hapusData(){

    if(selectedIndex==-1){
        alert("Pilih data terlebih dahulu");
        return;
    }

    if(confirm("Yakin ingin menghapus data?")){

        dataMenu.splice(selectedIndex,1);

        localStorage.setItem("MenuSehat",
        JSON.stringify(dataMenu));

        tampilData();
        resetForm();
    }
}

function resetForm(){

    document.getElementById("idMenu").value="";
    document.getElementById("namaMakanan").value="";
    document.getElementById("kalori").value="";
    document.getElementById("harga").value="";

    selectedIndex=-1;
}

tampilData();

</script>

</body>
</html>
